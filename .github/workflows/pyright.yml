name: Check types
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install 'ckan @ https://github.com/ckan/ckan/archive/refs/tags/ckan-2.12.0.zip' -r https://raw.githubusercontent.com/ckan/ckan/ckan-2.12.0/requirements.txt
          pip install -e . -r requirements.txt
      - name: Install node deps
        run: npm ci
      - name: Check types
        run: npx pyright --project pyproject.toml
